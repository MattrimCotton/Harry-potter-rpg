<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poudlard — Jeu de Rôle Solo</title>
  <style>
/* =============================================
   Poudlard RPG — Feuille de style
   Priorité : accessibilité clavier et focus visible
   ============================================= */

/* Classe standard d'accessibilité :
   visuellement invisible, mais lu par les lecteurs d'écran */
.sr-seul {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Lien d'évitement — visible uniquement au focus clavier */
.lien-evitement {
  position: absolute;
  left: -9999px;
}
.lien-evitement:focus {
  position: static;
  left: auto;
  padding: 0.5rem 1rem;
  background: #d4af37;
  color: #000;
  font-weight: bold;
  text-decoration: none;
  display: block;
}

/* Focus visible — indispensable pour navigation clavier */
:focus-visible {
  outline: 3px solid #d4af37;
  outline-offset: 3px;
}

/* Supprime le focus par clic souris, garde le focus clavier */
:focus:not(:focus-visible) {
  outline: none;
}

/* ---- Base ---- */
*, *::before, *::after {
  box-sizing: border-box;
}

html {
  font-size: 16px;
}

body {
  margin: 0;
  padding: 0;
  background: #1a0a00;
  color: #f0e6d3;
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 1.1rem;
  line-height: 1.7;
}

/* ---- En-tête ---- */
header {
  background: #0d0500;
  padding: 1rem 2rem;
  border-bottom: 2px solid #d4af37;
}

header h1 {
  margin: 0;
  color: #d4af37;
  font-size: 1.6rem;
  letter-spacing: 0.05em;
}

/* ---- Contenu principal ---- */
main {
  max-width: 800px;
  margin: 0 auto;
  padding: 1.5rem 2rem 3rem;
}

/* ---- Zone de narration ---- */
#narration {
  min-height: 5rem;
  padding: 1rem 1.25rem;
  background: #0d0500;
  border: 1px solid #4a3000;
  border-radius: 4px;
  margin-bottom: 2rem;
}

#narration p {
  margin: 0 0 0.5rem;
}

#narration p:last-child {
  margin-bottom: 0;
}

/* ---- Zone d'actions ---- */
#zone-actions h2 {
  font-size: 0.9rem;
  color: #a08060;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin: 0 0 0.75rem;
}

#liste-actions {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

#liste-actions button {
  width: 100%;
  padding: 0.7rem 1.25rem;
  background: #2a1500;
  color: #f0e6d3;
  border: 1px solid #6a4500;
  border-radius: 4px;
  font-family: inherit;
  font-size: 1rem;
  text-align: left;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#liste-actions button:hover {
  background: #3a2000;
  border-color: #d4af37;
}

#liste-actions button:focus-visible {
  background: #3a2000;
  border-color: #d4af37;
  outline: 3px solid #d4af37;
  outline-offset: 2px;
}

#liste-actions button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ---- Champs texte (création de personnage) ---- */
#liste-actions input[type="text"] {
  display: block;
  width: 100%;
  padding: 0.6rem 0.9rem;
  margin-bottom: 0.5rem;
  background: #0d0500;
  color: #f0e6d3;
  border: 1px solid #6a4500;
  border-radius: 4px;
  font-family: inherit;
  font-size: 1rem;
}

#liste-actions input[type="text"]:focus-visible {
  outline: 3px solid #d4af37;
  outline-offset: 2px;
  border-color: #d4af37;
}

#liste-actions input[type="text"]::placeholder {
  color: #666;
}

.raccourci {
  font-size: 0.8rem;
  color: #888;
  font-family: monospace;
  flex-shrink: 0;
  margin-left: 1rem;
}

/* ---- Fiche personnage (hors flux) ---- */
#fiche-personnage {
  max-width: 800px;
  margin: 2rem auto;
  padding: 1.5rem 2rem;
  border-top: 1px solid #4a3000;
}

#fiche-personnage h2 {
  color: #d4af37;
  font-size: 1rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border-bottom: 1px solid #4a3000;
  padding-bottom: 0.4rem;
  margin-bottom: 0.75rem;
}

#fiche-personnage dl {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 0.25rem 1rem;
  margin: 0 0 1rem;
}

#fiche-personnage dt {
  color: #a08060;
  font-weight: normal;
}

#fiche-personnage dd {
  margin: 0;
  font-weight: bold;
}

#fiche-personnage ul {
  list-style: disc;
  padding-left: 1.5rem;
  margin: 0 0 1rem;
}

</style>
</head>

  <a href="#zone-actions" class="lien-evitement">Aller aux actions</a>

  <header role="banner">
    <h1>Poudlard — Jeu de Rôle Solo</h1>
  </header>

  <main id="contenu-principal" tabindex="-1">

    <!-- Narration principale : polite, non-interruptive, log cumulatif -->
    <section aria-labelledby="titre-narration">
      <h2 id="titre-narration" class="sr-seul">Histoire</h2>
      <div
        id="narration"
        role="log"
        aria-live="polite"
        aria-atomic="false"
        aria-relevant="additions"
        tabindex="-1"
      ></div>
    </section>

    <!-- Résultats de dés et alertes : assertive, interrompt immédiatement -->
    <div
      id="alerte"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
      class="sr-seul"
    ></div>

    <!-- Statut bref (XP, Chance…) : polite, non-interruptif -->
    <div
      id="statut"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      class="sr-seul"
    ></div>

    <!-- Zone d'actions du moment -->
    <nav id="zone-actions" aria-label="Actions disponibles" tabindex="-1">
      <h2 class="sr-seul">Actions</h2>
      <ul role="list" id="liste-actions"></ul>
    </nav>

  </main>

  <!-- Fiche personnage — hors flux, lue par F1-F5 -->
  <aside id="fiche-personnage" aria-label="Fiche de personnage" hidden>
    <section id="section-traits" aria-labelledby="titre-traits" tabindex="-1">
      <h2 id="titre-traits">Traits</h2>
      <dl id="liste-traits"></dl>
    </section>
    <section id="section-etats" aria-labelledby="titre-etats" tabindex="-1">

    </section>
    <section id="section-amis" aria-labelledby="titre-amis" tabindex="-1">
      <h2 id="titre-amis">Amis et Rivaux</h2>
      <ul id="liste-amis"></ul>
    </section>
    <section id="section-chance" aria-labelledby="titre-chance" tabindex="-1">
      <h2 id="titre-chance">Chance et Expérience</h2>
      <dl id="liste-chance"></dl>
    </section>
  </aside>

uve pas à la bibliothèque ?","type":"Ami"},{"question":"Lequel d'entre vous je jalouse parce qu'il a de meilleures notes que moi dans ma matière préférée ?","type":"Rival"},{"question":"Lequel d'entre vous je soupçonne d'avoir triché sur un devoir ?","type":"Rival"}],"poufsouffle":[{"question":"Lequel d'entre vous m'a aidé à retrouver mon animal de compagnie perdu ?","type":"Ami"},{"question":"Lequel d'entre vous s'est faufilé avec moi aux cuisines avant le festin de la Toussaint ?","type":"Ami"},{"question":"Lequel d'entre vous aime passer ses après-midis du week-end dans les serres avec moi ?","type":"Ami"},{"question":"Lequel d'entre vous était assis à côté de moi lors de notre premier trajet sur le Poudlard Express ?","type":"Ami"},{"question":"Lequel d'entre vous ai-je fâché en insultant son animal de compagnie ?","type":"Rival"},{"question":"Lequel d'entre vous je n'aime pas parce qu'il passe trop de temps avec mon meilleur ami ?","type":"Rival"}],"serpentard":[{"question":"Lequel d'entre vous a découvert une salle cachée dans le château avec moi ?","type":"Ami"},{"question":"Lequel d'entre vous me doit un service pour ne pas avoir dit que vous étiez sortis après le couvre-feu ?","type":"Ami"},{"question":"Lequel d'entre vous est toujours assis à côté de moi aux repas ?","type":"Ami"},{"question":"Dont la famille est proche de la mienne depuis des générations ?","type":"Ami"},{"question":"Lequel d'entre vous je pense que c'est un grand fanfaron ?","type":"Rival"},{"question":"Lequel d'entre vous doute publiquement de mes capacités académiques ou sportives ?","type":"Rival"}]}},"contenu/scenarios/index.json":[{"id":"compartiment","titre":"Le Compartiment du Fond","accroche":"Une odeur de soufre, un sifflement mystérieux, et quelqu'un qui vous cache quelque chose.","annee_min":1,"annee_max":7,"duree_estimee":"30 à 45 minutes","manoeuvres":["Acquérir des Connaissances","Obtenir ce que l'on Cherche","Faire Face au Danger","Lancer un Sort"]}],"contenu/scenarios/compartiment.json":{"id":"compartiment","titre":"Le Compartiment du Fond","accroche":"Une odeur de soufre, un sifflement mystérieux, et quelqu'un qui vous cache quelque chose.","description":"À bord du Poudlard Express, un bruit étrange vous attire vers le dernier compartiment. Quelqu'un — ou quelque chose — s'y cache. Un scénario d'investigation et de magie adapté à tous les niveaux.","annee_min":1,"annee_max":7,"duree_estimee":"30 à 45 minutes","scenes":{"debut":{"narration":["Le Poudlard Express filait à travers les landes écossaises dans un grondement sourd et régulier, ses fenêtres maculées de la pluie persistante d'un début septembre résolument anglais. Dans votre compartiment, l'odeur des Chocogrenouilles se mêlait à celle des caramels au poivre que votre voisin de siège avait achetés à la dame du chariot — et aussitôt regrettés, à en juger par la couleur de son visage.","Vous regardiez défiler les collines sombres quand un bruit inhabituel vous parvint du fond du couloir. Pas le vacarme joyeux des compartiments voisins — non. Quelque chose d'autre. Un sifflement tenu, presque inaudible sous le grondement du train, accompagné d'une odeur qui n'avait rien à faire dans un wagon de chemin de fer : du soufre. Légèrement âcre, légèrement sucré, comme les cendres d'un feu qu'on n'avait pas voulu allumer.","Le compartiment du fond était le seul que personne n'avait choisi depuis King's Cross. Pourtant, vous y aviez vu quelqu'un entrer précipitamment au moment du départ."],"actions":[{"label":"Coller l'oreille à la cloison pour écouter discrètement","manoeuvre":"acquerir-connaissance","suite":{"succes":"ecoute-succes","partiel":"ecoute-partiel","echec":"ouverture"}},{"label":"Frapper à la porte et demander si tout va bien","lien":"ouverture"},{"label":"Continuer à regarder le paysage — ce n'est pas votre affaire","fin":"abandon"}]},"ecoute-succes":{"narration":["Vous collâtes discrètement l'oreille contre la cloison de bois. Derrière la porte du compartiment du fond, vous distinguâtes deux sons bien distincts.","Le premier était humain : la respiration saccadée de quelqu'un qui s'efforçait de ne pas faire de bruit, et n'y parvenait qu'à moitié. Une voix jeune, qui marmonnait tout bas — des supplications, semblait-il, adressées à quelque chose qui n'était clairement pas en position d'écouter.","Le second son ne l'était pas. Humain, s'entend. Un sifflement rythmé, presque mélodieux, ponctué de crépitements secs comme du bois qui brûle. Une chaleur douce, presque agréable, filtrait sous le bas de la porte. Cendre-Serpent, songea quelque chose dans votre mémoire — vous aviez lu ce nom quelque part. Une créature de feu, inoffensive jusqu'au moment où elle ne l'était plus. Et celle-là était visiblement à bout de patience."],"effet_entree":{"flag":"sait-creature"},"actions":[{"label":"Ouvrir la porte d'un geste décidé","lien":"ouverture"},{"label":"Frapper deux coups et annoncer votre présence","effet":{"flag":"a-frappe"},"lien":"ouverture"}]},"ecoute-partiel":{"narration":["Vous tendîtes l'oreille. Des sons filtraient sous la porte — un sifflement qui ressemblait à de la vapeur, et ce qui aurait pu être une voix humaine, ou pas. L'odeur de soufre, en revanche, ne laissait aucune place au doute : quelque chose ne tournait pas rond dans ce compartiment.","Vous ne sauriez pas ce qui se trouvait à l'intérieur sans ouvrir."],"actions":[{"label":"Ouvrir la porte","lien":"ouverture"}]},"ouverture":{"narration":["Vous poussâtes la porte du compartiment.","La première chose que vous vîtes fut le coffre. Il était posé en travers des banquettes, grand, en bois sombre cerclé de cuivre, et il brillait. Pas d'une lumière magique, propre et rassurante — non. D'une lueur orangée qui filtrait par les rainures du couvercle, pulsant doucement au rythme du sifflement que vous entendiez maintenant clairement.","La deuxième chose que vous vîtes fut le garçon assis en tailleur sur l'autre banquette, les genoux remontés contre la poitrine, les yeux ronds comme des Gallions. Il avait environ votre âge, des cheveux châtains qui partaient dans tous les sens, et une tache de suie sur le front qui suggérait qu'il avait déjà tenté d'approcher le coffre — avec des résultats peu concluants.","— Oh, fit-il en vous voyant. Oh non."],"actions":[{"label":"Lui parler calmement — demander ce qui se passe","manoeuvre":"obtenir","suite":{"succes":"theodore-parle","partiel":"theodore-partiel","echec":"theodore-panique"}},{"label":"Examiner le coffre de plus près","condition":"!flag:a-examine-coffre","effet":{"flag":"a-examine-coffre"},"manoeuvre":"acquerir-connaissance","suite":{"succes":"examen-succes","partiel":"examen-partiel","echec":"coffre-approche"}},{"label":"Dire : \"Je sais ce qu'il y a dans ce coffre. Je peux vous aider.\"","condition":"flag:sait-creature","effet":{"flag":"connaissance-utile"},"lien":"theodore-parle"}]},"theodore-parle":{"narration":["Quelque chose dans votre ton — ou peut-être simplement l'horreur de sa situation — eut raison de la méfiance du garçon. Il prit une grande inspiration.","— Théodore Plumcroft, dit-il. Et ce coffre appartient à mon oncle Aldric. Il m'a demandé de le surveiller pendant les vacances. Il transporte des créatures — enfin, il en transporte une. Une Cendre-Serpent. Elle était censée être somnolente, il m'avait dit. Elle était somnolente à l'aller. Mais là, depuis ce matin, elle ne dort plus du tout.","Le coffre craqua sinistrement. Théodore se ratatina un peu plus contre la paroi.","— Elle pond à peu près dans trois heures, ajouta-t-il d'une toute petite voix. Et les œufs de Cendre-Serpent brûlent tout ce qu'ils touchent. Alors j'ai pensé que si personne ne s'en apercevait..."],"effet_entree":{"flag":"sait-creature"},"actions":[{"label":"Proposer d'agir tout de suite — vous pouvez le faire","lien":"coffre-approche"},{"label":"Aller chercher un préfet ou le contrôleur","lien":"route-controleur"}]},"theodore-partiel":{"narration":["— C'est le coffre de mon oncle, dit le garçon d'une voix qui cherchait à paraître naturelle et n'y parvenait pas du tout. Il transporte quelque chose. Quelque chose qui ne devrait peut-être pas être là. Enfin. Ce n'est rien de dangereux. Normalement.","Il ajouta ce dernier mot avec le genre d'hésitation qui suggère que la situation avait évolué depuis le moment où cette affirmation avait été vraie.","Le coffre émit un sifflement. Le garçon sursauta légèrement."],"actions":[{"label":"Insister avec fermeté — que se passe-t-il vraiment ?","manoeuvre":"obtenir","suite":{"succes":"theodore-parle","partiel":"coffre-approche","echec":"theodore-panique"}},{"label":"Examiner le coffre vous-même sans attendre","condition":"!flag:a-examine-coffre","effet":{"flag":"a-examine-coffre"},"manoeuvre":"acquerir-connaissance","suite":{"succes":"examen-succes","partiel":"examen-partiel","echec":"coffre-approche"}},{"label":"Passer à l'action sans attendre ses explications","lien":"coffre-approche"}]},"theodore-panique":{"narration":["Le garçon se leva d'un bond — ce qui était une erreur, car son genou heurta le coin du coffre, qui bascula.","Le couvercle s'entrouvrit.","Il n'en fallut pas plus. Dans un sifflement aigu qui fit vibrer les vitres, quelque chose de luisant, de sinueux et d'orangé jaillit du coffre comme une flamme vivante et disparut dans l'entrebâillement de la porte en un éclair."],"actions":[{"label":"Courir après la Cendre-Serpent dans le couloir","lien":"ashwinder-libre"}]},"examen-succes":{"narration":["Vous vous accroupîtes devant le coffre. La chaleur qui en émanait était réelle — pas la chaleur magique tiède d'un sort de chauffage, mais quelque chose d'organique, de vivant. Les marques de brûlures sur le bois étaient récentes. Un cercle de suie noircissait les rainures du couvercle là où la fumée s'était frayé un passage.","Cendre-Serpent, dit votre mémoire avec une certaine précision. Reptile magique, classé XXX par le Ministère. Gérable pour qui sait s'y prendre. Elles répondent bien aux sorts d'immobilisation et à la chaleur contrôlée. Et surtout — il fallait agir avant qu'elle ne ponde."],"effet_entree":{"flag":"sait-creature"},"actions":[{"label":"Parler au garçon dans le coin — vous savez ce qu'il cache","lien":"theodore-parle"},{"label":"S'occuper du coffre directement, sans perdre de temps","lien":"coffre-approche"}]},"examen-partiel":{"narration":["Le coffre était chaud — anormalement chaud pour un simple contenant de voyage. Les traces de brûlures sur le bois étaient récentes. La chaleur pulsait de façon régulière, rythmée par le sifflement, comme une respiration. Quelque chose de vivant. Au-delà, vous n'auriez su dire avec certitude."],"actions":[{"label":"Interroger le garçon — qu'est-ce qu'il y a là-dedans ?","manoeuvre":"obtenir","suite":{"succes":"theodore-parle","partiel":"theodore-partiel","echec":"theodore-panique"}},{"label":"Ouvrir le coffre prudemment","lien":"coffre-approche"}]},"coffre-approche":{"narration":["Vous vous avançâtes vers le coffre. La chaleur augmentait à mesure que vous vous approchiez — pas assez pour brûler, mais assez pour vous rappeler que ce qui se trouvait à l'intérieur était très loin d'être endormi. La lueur orangée pulsait plus vite maintenant, comme si la créature sentait votre présence et en était contrariée.","— Attendez, chuchota Théodore derrière vous. Faites attention. Elle n'est pas... elle n'est pas de bonne humeur.","Vous aviez remarqué. Il vous fallait agir — la Cendre-Serpent ne resterait pas dans ce coffre très longtemps."],"actions":[{"label":"Lancer Immobulus pour figer la créature à travers le bois","condition":"sort:Immobulus","manoeuvre":"lancer-sort","suite":{"succes":"capture-succes","partiel":"capture-partiel","echec":"theodore-panique"}},{"label":"Lancer Incarcerous pour ligoter la créature dans le coffre","condition":"sort:Incarcerous","manoeuvre":"lancer-sort","suite":{"succes":"capture-succes","partiel":"capture-partiel","echec":"theodore-panique"}},{"label":"Refermer soigneusement le coffre et coincer le loquet avec force","manoeuvre":"faire-face","suite":{"succes":"capture-succes","partiel":"capture-partiel","echec":"theodore-panique"}},{"label":"Attirer la créature avec votre chaleur corporelle pour la calmer, puis refermer","condition":"flag:sait-creature","manoeuvre":"faire-face","suite":{"succes":"capture-succes","partiel":"capture-partiel","echec":"theodore-panique"}},{"label":"Aller chercher le contrôleur — ce n'est plus gérable seul","lien":"route-controleur"}]},"capture-succes":{"narration":["La créature se figea. Un instant, deux — puis elle se détendit lentement, comme si la tension qui l'animait venait d'être évacuée d'un seul coup. Le sifflement s'éteignit. La lueur orangée dans le coffre passa du rouge vif à un orange paisible, puis à un jaune presque chaleureux.","Vous refermâtes soigneusement le couvercle. Le loquet claqua.","Dans le silence revenu, Théodore Plumcroft vous regarda d'une façon qu'il n'avait encore jamais adressée à personne : avec une admiration totale, sans réserve, du genre qui ne cherche même pas à se dissimuler.","— Comment vous avez fait ça ? dit-il."],"fin":"triomphe"},"capture-partiel":{"narration":["La Cendre-Serpent ne fut pas exactement capturée. Elle fut contenue. Avec difficulté. Et un peu de chance. Et un bref intermède pendant lequel la banquette du fond prit feu sur environ vingt centimètres — ce qui avait l'air pire que ce n'était, parce que la magie du train absorba la plus grande partie de la chaleur.","Au final, la créature était de retour dans le coffre. Le coffre était fermé. La fumée se dissipait lentement.","Théodore ne dit rien pendant un long moment. Puis :","— Je pense que votre manteau va bien, dit-il. Enfin, la plupart."],"fin":"normal"},"ashwinder-libre":{"narration":["La Cendre-Serpent — car c'en était bien une, vous la reconnûtes immédiatement — filait dans le couloir du Poudlard Express comme une langue de flamme orange vif. Elle mesurait environ soixante centimètres, ses écailles luisaient comme des braises, et partout où sa queue effleurait le sol, elle laissait une légère trace de roussi sur la moquette bordeaux.","Des cris s'élevèrent de deux compartiments voisins. Quelqu'un hurla quelque chose sur un Diablotin du Feu. Un autre claqua sa porte.","Au fond du couloir, la silhouette verte et argent d'une préfète de Serpentard apparut, son badge luisant sous les appliques dorées du wagon. Elle regardait dans votre direction d'un air qui n'augurerait rien de bon dans les mois à venir.","La situation exigeait une décision immédiate."],"actions":[{"label":"Courir après la Cendre-Serpent et tenter de la capturer à mains nues","manoeuvre":"faire-face","suite":{"succes":"capture-couloir-succes","partiel":"capture-couloir-partiel","echec":"resolution-chaos"}},{"label":"Lancer un sort pour stopper la créature depuis ici","condition":"sort:Immobulus || sort:Incarcerous","manoeuvre":"lancer-sort","suite":{"succes":"capture-couloir-succes","partiel":"capture-couloir-partiel","echec":"pris-par-prefet"}},{"label":"Se glisser dans un compartiment vide pour éviter le préfet","manoeuvre":"cacher-faufiler","suite":{"succes":"cache-succes","partiel":"cache-partiel","echec":"pris-par-prefet"}}]},"cache-succes":{"narration":["Vous vous glissâtes dans un compartiment vide avec la rapidité d'un Vif d'Or, tirant Théodore — qui protestait à mi-voix — derrière vous. La porte se referma sans bruit. Vous entendîtes la préfète passer dans le couloir, les semelles claquant sur le plancher, suivie de deux élèves qui discutaient à voix haute de ce qu'ils avaient soi-disant vu.","Une fois le calme revenu, vous échangeâtes un regard avec Théodore.","— Elle est toujours là-dehors, chuchota-t-il.","— Je sais, chuchotâtes-vous."],"actions":[{"label":"Ressortir discrètement pour retrouver et capturer la créature","manoeuvre":"cacher-faufiler","suite":{"succes":"capture-couloir-succes","partiel":"capture-couloir-partiel","echec":"pris-par-prefet"}}]},"cache-partiel":{"narration":["Vous vous glissâtes dans un compartiment, mais pas assez vite. La préfète vous vit entrer. Elle s'arrêta, fronça les sourcils, puis continua son chemin — la Cendre-Serpent était manifestement une priorité plus urgente que votre présence dans un compartiment non attribué.","Pour l'instant."],"actions":[{"label":"Profiter du délai pour capturer la créature avant que la préfète revienne","manoeuvre":"faire-face","suite":{"succes":"capture-couloir-succes","partiel":"capture-couloir-partiel","echec":"pris-par-prefet"}}]},"capture-couloir-succes":{"narration":["Vous coinçâtes la Cendre-Serpent dans un angle du couloir à l'aide d'une combinaison d'adresse et de bonne fortune. Elle siffla, se cabra — puis se calma aussi soudainement qu'elle s'était énervée. Théodore déposa le coffre ouvert à ses côtés. La créature y glissa comme si l'idée venait d'elle.","— C'est extraordinaire, dit Théodore. Vous êtes extraordinaire.","La préfète, à l'autre bout du couloir, prenait des notes sur un bout de parchemin d'un air peu enthousiaste."],"fin":"triomphe"},"capture-couloir-partiel":{"narration":["Vous parvîntes à repousser la Cendre-Serpent vers le compartiment du fond avant qu'elle ne causât trop de dégâts — à part un sac de voyage fondu, deux Chocogrenouilles réduites en cendres, et une marque de brûlure sur le panneau d'instructions de sécurité du wagon.","Théodore referma le coffre derrière elle. La préfète arriva au même moment et nota vos noms dans son carnet sans rien dire. Ce qui, dans l'univers des préfets, équivalait à un commentaire très élaboré."],"fin":"normal"},"pris-par-prefet":{"narration":["La préfète vous coinça dans le couloir avec l'efficacité sans fioriture de quelqu'un habituée à ce genre de situation. Mélisande Fairborough, indiquait son badge argent. Elle examina la trace de roussi sur la moquette, la sueur sur votre front, et Théodore qui essayait de disparaître derrière vous.","— J'attends une explication, dit-elle d'un ton qui ne laissait aucune place à la créativité."],"actions":[{"label":"Expliquer la situation honnêtement — Cendre-Serpent, coffre, tout","manoeuvre":"obtenir","suite":{"succes":"resolution-avec-prefete","partiel":"resolution-ennuis","echec":"resolution-chaos"}}]},"resolution-avec-prefete":{"narration":["La préfète Fairborough vous écouta sans vous interrompre une seule fois, ce qui constituait en soi un exploit remarquable. Quand vous eûtes terminé, elle referma son carnet.","— Très bien, dit-elle. J'apprécie l'honnêteté. Et je note que vous avez tenté de résoudre la situation sans en référer à un adulte, ce qui est à la fois courageux et complètement irresponsable. Ces deux choses ne s'excluent pas mutuellement.","Elle alla chercher le contrôleur. La Cendre-Serpent fut capturée en huit minutes grâce au gant de protection enchanté que le Poudlard Express conservait pour précisément ce type de situation."],"fin":"normal"},"resolution-ennuis":{"narration":["La préfète Fairborough rédigea un rapport en trois copies. Vous eûtes droit à une convocation dans le bureau du Directeur dans les quarante-huit premières heures de l'année scolaire, ce qui constituait un record personnel que vous espériez ne jamais battre.","La bonne nouvelle : la Cendre-Serpent avait finalement été récupérée par le contrôleur. La moins bonne : votre réputation prendrait un peu plus de temps à se remettre de l'aventure.","Théodore vous trouva dans le couloir le lendemain matin.","— C'est entièrement de ma faute, dit-il. Je le dirai à qui voudra bien l'entendre.","Ce n'était pas grand-chose. Mais c'était sincère."],"fin":"ennuis"},"resolution-chaos":{"narration":["Le compte rendu officiel de l'incident, tel qu'il figurerait dans les archives du Poudlard Express, ferait état d'une Cendre-Serpent échappée, d'une moquette partiellement carbonisée sur quatre mètres et demi, d'un chariot à friandises dont les roues avaient fondu, et d'un nombre non précisé d'élèves qui refuseraient de reparler de l'affaire.","La préfète Fairborough nota votre nom trois fois, ce qui était apparemment sa façon d'exprimer une opinion très marquée."],"fin":"chaos"},"route-controleur":{"narration":["Vous trouvâtes le contrôleur du train à l'autre bout du wagon, en train de tamponner des billets avec la placidité d'un homme pour qui les créatures magiques dans ses wagons constituaient un incident ordinaire — ce qui, sur le Poudlard Express, n'était pas tout à fait faux.","Il vous écouta. Il soupira. Il rangea son tampon.","— Quatrième fois ce semestre que quelqu'un embarque quelque chose qui ne devrait pas l'être, dit-il. Venez avec moi."],"fin":"controleur"}},"fins":{"triomphe":{"narration":["Le reste du voyage jusqu'à Poudlard se passa dans une relative normalité, si l'on excepte les dix minutes que vous passâtes à expliquer la situation à la préfète Fairborough, qui nota tout avec un soin méticuleux et vous adressa, in fine, quelque chose qui ressemblait à un hochement de tête approbateur — ce qui, sur l'échelle des réactions préfectorales, constituait un éloge considérable.","Théodore Plumcroft s'assit à côté de vous pour le reste du trajet. Il parla beaucoup — de son oncle Aldric qui collectionnait les créatures magiques, de sa mère qui désapprouvait, de sa sœur qui avait peur des chouettes, de son vœu d'intégrer un jour la Protection des Êtres Magiques au Ministère.","Quand Poudlard apparut au-delà des collines, étincelant de mille lumières dans la nuit écossaise, il se tourna vers vous.","— Je ne sais pas comment vous remercier, dit-il. Vraiment.","— Commencez par apprendre quelques sorts, lui dîtes-vous.","Il rit. Vous pensâtes que peut-être, cette année, vous auriez un ami de plus."],"ami":"Théodore Plumcroft"},"normal":{"narration":["L'affaire de la Cendre-Serpent se conclut dans une certaine confusion mais sans catastrophe majeure — ce qui, tout bien considéré, était déjà un résultat acceptable pour un voyage en train.","Théodore Plumcroft dit merci deux fois, puis une troisième pour faire bonne mesure. La préfète nota trois noms dans cacité qui vous parut presque décevante.","— La prochaine fois que votre oncle vous confie une créature classée XXX, dit le contrôleur à Théodore avec un calme olympien, prévenez-nous au départ de King's Cross.","Théodore acquiesça avec toute la dignité d'un garçon qui vient d'éviter une catastrophe de justesse. Dans le compartiment, en attendant l'arrivée à Pré-au-Lard, il vous regarda de côté.","— Vous auriez pu ne pas vous mêler de ça, dit-il. Merci de l'avoir fait quand même."],"ami":"Théodore Plumcroft"},"abandon":{"narration":["Vous aviez décidé de ne pas vous en mêler. C'était votre droit le plus strict.","Plus tard, dans la Grande Salle, vous entendîtes quelqu'un raconter l'histoire d'un élève courageux qui avait maîtrisé une Cendre-Serpent dans le Poudlard Express. Ce n'était pas vous.","Ça aurait pu l'être."]}}}};

// ===== narration.js =====
const { configurerTTS, ttsEstActif, narrer, narrerFrais, alerter, statuer, relire } = (function() {
// Module central d'annonces — ARIA live regions + TTS optionnel.
// TOUT le texte du jeu passe par ce module.
// Par défaut, le lecteur d'écran (NVDA, VoiceOver…) gère les annonces via ARIA.
// Le TTS du navigateur est un complément optionnel configurable.

const $narration = document.getElementById('narration');
const $alerte    = document.getElementById('alerte');
const $statut    = document.getElementById('statut');

let dernierMessage = '';
let ttsActif  = false;
let vitesseTTS = 1.0;
let volumeTTS  = 1.0;

// ---- Configuration ----

function configurerTTS({ actif, vitesse, volume } = {}) {
  if (actif   !== undefined) ttsActif   = actif;
  if (vitesse !== undefined) vitesseTTS = vitesse;
  if (volume  !== undefined) volumeTTS  = volume;
}

function ttsEstActif() {
  return ttsActif;
}

// ---- Fonctions publiques ----

// Ajoute un paragraphe au log narratif (aria-live="polite").
// Le lecteur d'écran le lit dès qu'il est disponible.
function narrer(texte) {
  if (!texte) return;
  dernierMessage = texte;

  const p = document.createElement('p');
  p.textContent = texte;
  $narration.appendChild(p);
  $narration.scrollTop = $narration.scrollHeight;

  if (ttsActif) _dire(texte);
}

// Efface le log narratif puis pose un nouveau texte.
// Utile pour les transitions d'écran.
function narrerFrais(texte) {
  if (!texte) return;
  dernierMessage = texte;

  $narration.textContent = '';
  const p = document.createElement('p');
  p.textContent = texte;
  $narration.appendChild(p);

  if (ttsActif) _dire(texte, true);
}

// Annonce immédiate via aria-live="assertive".
// Interrompt le lecteur d'écran. Réservé aux résultats de dés et alertes importantes.
function alerter(texte) {
  if (!texte) return;
  dernierMessage = texte;

  // Vider avant de remplir force la ré-annonce même si le texte est identique
  $alerte.textContent = '';
  requestAnimationFrame(() => {
    $alerte.textContent = texte;
    if (ttsActif) _dire(texte, true);
  });
}

// Statut bref, non-interruptif (rôle="status").
function statuer(texte) {
  $statut.textContent = '';
  requestAnimationFrame(() => {
    $statut.textContent = texte;
  });
}

// Relit le dernier message annoncé (touche Espace).
function relire() {
  if (!dernierMessage) return;

  if (ttsActif) {
    _dire(dernierMessage, true);
  } else {
    // Sans TTS : forcer NVDA/VoiceOver à relire via la région assertive
    $alerte.textContent = '';
    requestAnimationFrame(() => {
      $alerte.textContent = 'Répétition : ' + dernierMessage;
    });
  }
}

// ---- Fonction TTS interne ----

function _dire(texte, interrompre = false) {
  if (!('speechSynthesis' in window)) return;
  if (interrompre) speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(texte);
  u.lang   = 'fr-FR';
  u.rate   = vitesseTTS;
  u.volume = volumeTTS;
  speechSynthesis.speak(u);
}

  return { configurerTTS, ttsEstActif, narrer, narrerFrais, alerter, statuer, relire };
})();

const { creerPersonnageVide, traitEffectif, traitLePlusEleve, tousEtatsActifs, appliquerOrigine, appliquerMaison, NOMS_TRAITS } = (function() {
// État du personnage joueur — structure de données et helpers.

function creerPersonnageVide() {
  return {
    // Identité
    prenom:  '',
    nom:     '',
    annee:   1,
    maison:  '',
    origine: '', // 'ne-moldu' | 'demi-sang' | 'sang-pur'

    // Apparence (cosmétique, pas d'impact mécanique)
    teint:      '',
    cheveux:    '',
    silhouette: '',

    // Baguette
    baguette: { bois: '', coeur: '', aspect: '' },
    ambition: '',

    // Patronus
    patronus: '',

    // Animal de compagnie
    animal: { type: '', nom: '' },

    // Traits (valeurs : -1, 0, +1, +1, +2 répartis)
    traits: {
      bravoure:  0,
      ruse:      0,
      intellect: 0,
      loyaute:   0,
      magie:     0
    },

    // Matières préférées (max 2 après progression)
    matieresPreferees: [],

    // Sorts connus — [{ nom, description, annee, type }]
    sorts: [],

    // Objets magiques
    objetsMagiques: [],

    // Relations
    amis:   [], // max 2
    rivaux: [], // max 1

    // Ressources
    chance:     3,
    experience: 0,

    // États (Conditions) — tous désactivés par défaut
    etats: [
      { id: 'apeure',      nom: 'Apeuré',      trait: 'bravoure',  malus: -2, actif: false },
      { id: 'furieux',     nom: 'Furieux',      trait: 'ruse',      malus: -2, actif: false },
      { id: 'stresse',     nom: 'Stressé',      trait: 'intellect', malus: -2, actif: false },
      { id: 'jaloux',      nom: 'Jaloux',       trait: 'loyaute',   malus: -2, actif: false },
      { id: 'gene',        nom: 'Gêné',         trait: 'magie',     malus: -2, actif: false },
      { id: 'blesse',      nom: 'Blessé',       trait: 'tous',      malus: -1, actif: false },
      { id: 'ensorcele',   nom: 'Ensorcelé',    trait: 'choix',     malus: -1, actif: false },
      { id: 'inconscient', nom: 'Inconscient',  trait: 'tous',      malus: -99, actif: false }
    ],

    // Cicatrices (séquelles après retour d'inconscience)
    cicatrices: [],

    // Compteurs de progressions limitées
    progressions: {
      traitsAmeliores:     0, // max 2 fois (jamais plus de +3)
      deuxiemeMatiere:     false
    }
  };
}

// Retourne la valeur effective d'un trait, malus d'états inclus.
function traitEffectif(personnage, nomTrait) {
  const etat = personnage.etats;

  if (etat.find(e => e.id === 'inconscient' && e.actif)) return -99;

  const base = personnage.traits[nomTrait] ?? 0;

  // Malus spécifique au trait
  const etatDuTrait = etat.find(e => e.trait === nomTrait && e.actif);
  const malusTrait  = etatDuTrait ? etatDuTrait.malus : 0;

  // Malus "Blessé" (-1 à tous les traits)
  const malusBlesse = etat.find(e => e.id === 'blesse' && e.actif) ? -1 : 0;

  return base + malusTrait + malusBlesse;
}

// Retourne le trait le plus élevé (pour le jet de survie quand tous les états sont cochés).
function traitLePlusEleve(personnage) {
  const traits = personnage.traits;
  return Math.max(traits.bravoure, traits.ruse, traits.intellect, traits.loyaute, traits.magie);
}

// Vérifie si les 8 états sont actifs.
function tousEtatsActifs(personnage) {
  return personnage.etats.every(e => e.actif);
}

// Applique l'expérience d'origine au personnage.
function appliquerOrigine(personnage) {
  const xpParOrigine = {
    'ne-moldu':  3,
    'demi-sang': 2,
    'sang-pur':  1
  };
  personnage.experience = xpParOrigine[personnage.origine] ?? 0;
}

// Applique le bonus de maison (+1 au trait correspondant).
function appliquerMaison(personnage) {
  const bonusMaison = {
    'Gryffondor':  'bravoure',
    'Poufsouffle': 'loyaute',
    'Serdaigle':   'intellect',
    'Serpentard':  'ruse'
  };
  const trait = bonusMaison[personnage.maison];
  if (trait) personnage.traits[trait] = Math.min(3, personnage.traits[trait] + 1);
}

// Noms lisibles des traits.
const NOMS_TRAITS = {
  bravoure:  'Bravoure',
  ruse:      'Ruse',
  intellect: 'Intellect',
  loyaute:   'Loyauté',
  magie:     'Magie'
};

  return { creerPersonnageVide, traitEffectif, traitLePlusEleve, tousEtatsActifs, appliquerOrigine, appliquerMaison, NOMS_TRAITS };
})();

const { sauvegarder, charger, effacer, aUneSauvegarde } = (function() {
// Sauvegarde et chargement via localStorage.



const CLE = 'poudlard_rpg_v1';

function sauvegarder(etat) {
  try {
    localStorage.setItem(CLE, JSON.stringify(etat));
    statuer('Partie sauvegardée.');
    return true;
  } catch {
    statuer('Erreur lors de la sauvegarde.');
    return false;
  }
}

function charger() {
  try {
    const data = localStorage.getItem(CLE);
    return data ? JSON.parse(data) : null;
  } catch {
    return null;
  }
}

function effacer() {
  localStorage.removeItem(CLE);
}

function aUneSauvegarde() {
  return localStorage.getItem(CLE) !== null;
}

  return { sauvegarder, charger, effacer, aUneSauvegarde };
})();

const { afficherActions } = (function() {
// Gestion de la zone d'actions clavier.
// Chaque action est un <button> dans une <ul> accessible.

// Format d'une action :
// { label: string, action: () => void, raccourci?: string, desactive?: bool }

function afficherActions(actions) {
  const $liste = document.getElementById('liste-actions');
  $liste.innerHTML = '';

  if (!actions || actions.length === 0) {
    const li = document.createElement('li');
    li.textContent = 'Aucune action disponible.';
    $liste.appendChild(li);
    return;
  }

  actions.forEach(({ label, action, raccourci, desactive }) => {
    const li  = document.createElement('li');
    const btn = document.createElement('button');

    if (raccourci) {
      // Label accessible complet sans le span visuel
      btn.setAttribute('aria-label', `${label}, raccourci ${raccourci}`);

      const spanLabel    = document.createElement('span');
      spanLabel.textContent = label;
      spanLabel.setAttribute('aria-hidden', 'true');

      const spanRaccourci = document.createElement('span');
      spanRaccourci.className   = 'raccourci';
      spanRaccourci.textContent = raccourci;
      spanRaccourci.setAttribute('aria-hidden', 'true');

      btn.appendChild(spanLabel);
      btn.appendChild(spanRaccourci);
    } else {
      btn.textContent = label;
    }

    if (desactive) {
      btn.disabled = true;
    } else {
      btn.addEventListener('click', action);
    }

    li.appendChild(btn);
    $liste.appendChild(li);
  });

  // Focus automatique sur le premier bouton actif
  const premier = $liste.querySelector('button:not([disabled])');
  if (premier) premier.focus();
}

  return { afficherActions };
})();

const { lancerDes, d6, deuxD6Independants, SUCCES_COMPLET, SUCCES_PARTIEL, ECHEC } = (function() {
// Moteur de dés — jets 2d6 selon les règles PbtA.
// Toujours annoncer le résultat via alerter() pour les non-voyants.



// Résultats possibles
const SUCCES_COMPLET = 'succes';
const SUCCES_PARTIEL = 'partiel';
const ECHEC          = 'echec';

// Lance 2d6 + valeur de trait. Annonce le résultat et le retourne.
function lancerDes(valeurTrait, nomTrait) {
  const d1 = _d6();
  const d2 = _d6();
  const sousTotal = d1 + d2;
  const total     = sousTotal + valeurTrait;

  const signeTrait = _signeParle(valeurTrait);

  let texteOutcome;
  let niveau;

  if (total >= 10) {
    texteOutcome = 'Succès complet.';
    niveau = SUCCES_COMPLET;
  } else if (total >= 7) {
    texteOutcome = 'Succès partiel.';
    niveau = SUCCES_PARTIEL;
  } else {
    texteOutcome = 'Échec. Marquez un point d\'Expérience.';
    niveau = ECHEC;
  }

  const annonce = [
    `Jet de ${nomTrait}.`,
    `Dé 1 : ${d1}. Dé 2 : ${d2}. Sous-total : ${sousTotal}.`,
    `${nomTrait} à ${signeTrait}. Total final : ${total}.`,
    texteOutcome
  ].join(' ');

  alerter(annonce);

  return { d1, d2, sousTotal, total, niveau, texteOutcome };
}

// Lance 1d6 simple (pour tables de création).
function d6() {
  return _d6();
}

// Lance 2d6 indépendants (pour tables à deux entrées : ex. Patronus).
function deuxD6Independants() {
  return [_d6(), _d6()];
}

// ---- Interne ----

function _d6() {
  return Math.ceil(Math.random() * 6);
}

function _signeParle(valeur) {
  if (valeur === 0)  return 'zéro';
  if (valeur > 0)    return `plus ${valeur}`;
  return `moins ${Math.abs(valeur)}`;
}

  return { lancerDes, d6, deuxD6Independants, SUCCES_COMPLET, SUCCES_PARTIEL, ECHEC };
})();

// ===== fiche.js =====
const { lireFiche, mettreAJourFiche } = (function() {
// Lecture et affichage de la fiche de personnage.
// Appelé par les touches F1-F5.




// Lit une section de la fiche à voix haute via alerter().
function lireFiche(section, personnage) {
  if (!personnage || !personnage.prenom) {
    alerter('Aucun personnage créé pour l\'instant.');
    return;
  }

  let texte = '';

  switch (section) {
    case 'traits': {
      const lignes = Object.entries(NOMS_TRAITS).map(([cle, nom]) => {
        const effectif = traitEffectif(personnage, cle);
        const base     = personnage.traits[cle];
        const diff     = effectif - base;
        let str = `${nom} : ${_signeParle(base)}`;
        if (diff !== 0) str += ` (effectif : ${_signeParle(effectif)} à cause des états)`;
        return str;
      });
      texte = 'Vos traits. ' + lignes.join('. ') + '.';
      _focusSection('section-traits');
      break;
    }

    case 'etats': {
      const actifs = personnage.etats.filter(e => e.actif);
      if (actifs.length === 0) {
        texte = 'Aucun état actif. Vous êtes en pleine forme.';
      } else {
        const noms = actifs.map(e => {
          const malus = e.malus === -99 ? 'hors jeu' : `malus ${_signeParle(e.malus)}`;
          return `${e.nom}, ${malus} en ${e.trait === 'tous' ? 'tous les traits' : NOMS_TRAITS[e.trait] ?? e.trait}`;
        });
        texte = `${actifs.length} état${actifs.length > 1 ? 's' : ''} actif${actifs.length > 1 ? 's' : ''} : ` + noms.join('. ') + '.';
      }
      _focusSection('section-etats');
      break;
    }

    case 'sorts': {
      if (!personnage.sorts || personnage.sorts.length === 0) {
        texte = 'Vous ne connaissez aucun sort pour l\'instant.';
      } else {
        const liste = personnage.sorts.map(s => `${s.nom} : ${s.description}`).join('. ');
        texte = `Sorts connus, ${personnage.sorts.length} au total. ${liste}.`;
      }
      _focusSection('section-sorts');
      break;
    }

    case 'amis': {
      const amis   = personnage.amis.length > 0
        ? `Amis : ${personnage.amis.join(', ')}.`
        : 'Aucun ami.';
      const rivaux = personnage.rivaux.length > 0
        ? `Rivaux : ${personnage.rivaux.join(', ')}.`
        : 'Aucun rival.';
      texte = amis + ' ' + rivaux + ' Rappel : un ami ou un rival vous donne plus un au jet pour l\'aider ou l\'entraver.';
      _focusSection('section-amis');
      break;
    }

    case 'chance': {
      const xpManquant = 4 - personnage.experience;
      texte = [
        `Chance : ${personnage.chance} point${personnage.chance !== 1 ? 's' : ''} sur 3.`,
        `Expérience : ${personnage.experience} point${personnage.experience !== 1 ? 's' : ''} sur 4.`,
        xpManquant > 0
          ? `Il vous faut encore ${xpManquant} point${xpManquant > 1 ? 's' : ''} pour une Progression.`
          : 'Vous pouvez prendre une Progression.',
        personnage.cicatrices.length > 0
          ? `Cicatrices : ${personnage.cicatrices.join(', ')}.`
          : ''
      ].filter(Boolean).join(' ');
      _focusSection('section-chance');
      break;
    }
  }

  if (texte) alerter(texte);
}

// Met à jour le DOM de la fiche (appelé après chaque changement d'état).
function mettreAJourFiche(personnage) {
  if (!personnage) return;

  // Traits
  const $traits = document.getElementById('liste-traits');
  $traits.innerHTML = '';
  Object.entries(NOMS_TRAITS).forEach(([cle, nom]) => {
    const val = personnage.traits[cle];
    _ajouterDL($traits, nom, val >= 0 ? `+${val}` : `${val}`);
  });

  // États
  const $etats = document.getElementById('liste-etats');
  $etats.innerHTML = '';
  const actifs = personnage.etats.filter(e => e.actif);
  if (actifs.length === 0) {
    _ajouterLI($etats, 'Aucun état actif.');
  } else {
    actifs.forEach(e => _ajouterLI($etats, `${e.nom} (${_signeParle(e.malus)})`));
  }

  // Sorts
  const $sorts = document.getElementById('liste-sorts');
  $sorts.innerHTML = '';
  if (!personnage.sorts?.length) {
    _ajouterLI($sorts, 'Aucun sort connu.');
  } else {
    personnage.sorts.forEach(s => _ajouterLI($sorts, `${s.nom} — ${s.description}`));
  }

  // Amis & Rivaux
  const $amis = document.getElementById('liste-amis');
  $amis.innerHTML = '';
  personnage.amis.forEach(n   => _ajouterLI($amis, `Ami : ${n}`));
  personnage.rivaux.forEach(n => _ajouterLI($amis, `Rival : ${n}`));
  if (!personnage.amis.length && !personnage.rivaux.length) _ajouterLI($amis, 'Aucune relation.');

  // Chance & Expérience
  const $chance = document.getElementById('liste-chance');
  $chance.innerHTML = '';
  _ajouterDL($chance, 'Chance',      `${personnage.chance} / 3`);
  _ajouterDL($chance, 'Expérience',  `${personnage.experience} / 4`);
  _ajouterDL($chance, 'Maison',      personnage.maison      || '—');
  _ajouterDL($chance, 'Origine',     _labelOrigine(personnage.origine));
  _ajouterDL($chance, 'Année',       personnage.annee ? `${personnage.annee}e année` : '—');
  _ajouterDL($chance, 'Patronus',    personnage.patronus    || 'Non découvert');
  if (personnage.cicatrices?.length) {
    _ajouterDL($chance, 'Cicatrices', personnage.cicatrices.join(', '));
  }

  // Rendre la fiche visible
  document.getElementById('fiche-personnage').hidden = false;
}

// ---- Helpers DOM ----

function _ajouterDL($parent, terme, valeur) {
  const dt = document.createElement('dt');
  dt.textContent = terme;
  const dd = document.createElement('dd');
  dd.textContent = valeur;
  $parent.appendChild(dt);
  $parent.appendChild(dd);
}

function _ajouterLI($parent, texte) {
  const li = document.createElement('li');
  li.textContent = texte;
  $parent.appendChild(li);
}

function _focusSection(id) {
  const el = document.getElementById(id);
  if (el) el.focus();
}

function _signeParle(val) {
  if (val === -99) return 'hors jeu';
  if (val >= 0)    return `plus ${val}`;
  return `moins ${Math.abs(val)}`;
}

function _labelOrigine(origine) {
  const labels = { 'ne-moldu': 'Né-Moldu', 'demi-sang': 'Demi-sang', 'sang-pur': 'Sang-pur' };
  return labels[origine] || '—';
}

  return { lireFiche, mettreAJourFiche };

// ===== clavier.js =====
const { initClavier } = (function() {
// Raccourcis clavier globaux.
// Enregistrer une seule fois au démarrage.



// cbLireFiche(section) : 'traits' | 'etats' | 'sorts' | 'amis' | 'chance'
// cbSauvegarder()
// cbRelancerDes()
function initClavier({ lireFiche, sauvegarder, relancerDes }) {
  document.addEventListener('keydown', (e) => {
    // Ne pas capturer les touches dans un champ de texte
    const tag = document.activeElement?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

    switch (e.key) {
      case ' ':
        // Espace sur un bouton = clic navigateur — ne capturer que hors bouton
        if (document.activeElement?.tagName === 'BUTTON') return;
        e.preventDefault();
        relire();
        break;

      case 'F1':
        e.preventDefault();
        lireFiche('traits');
        break;

      case 'F2':
        e.preventDefault();
        lireFiche('etats');
        break;

      case 'F3':
        e.preventDefault();
        lireFiche('sorts');
        break;

      case 'F4':
        e.preventDefault();
        lireFiche('amis');
        break;

      case 'F5':
        e.preventDefault();
        lireFiche('chance');
        break;

      case 'r':
      case 'R':
        if (relancerDes) relancerDes();
        break;

      case 's':
      case 'S':
        if (sauvegarder) sauvegarder();
        break;
    }
  });
}

  return { initClavier };
})();

// onFin({ niveau, personnage }) est appelé une fois les choix faits.
function resoudreManoeuvre(manoeuvre, personnage, onFin) {
  // Cas spécial : Obtenir — choisir d'abord honnête ou ruse
  if (manoeuvre.id === 'obtenir') {
    _choisirApproche(manoeuvre, personnage, onFin);
    return;

  const nomTrait  = manoeuvre.trait;
  const valTrait  = traitEffectif(personnage, nomTrait);
  const labelTrait = NOMS_TRAITS[nomTrait];

  // Vérifier l'inconscience
  if (valTrait === -99) {
    alerter('Vous êtes Inconscient. Vous ne pouvez pas agir.');
    onFin({ niveau: ECHEC, personnage });
    return;
  }

  narrer(`${manoeuvre.nom}. Jet de ${labelTrait}. Valeur : ${_signeParle(valTrait)}.`);

  // Option : dépenser la Chance avant de lancer
  const actionsDAvant = [
    {
      label: `Lancer ${labelTrait} (${_signeParle(valTrait)})`,
      action: () => _effectuerJet(manoeuvre, personnage, nomTrait, valTrait, onFin)
    }
  ];

  if (personnage.chance > 0) {
    actionsDAvant.push({
      label: `Dépenser 1 point de Chance pour un succès complet automatique (Chance restante : ${personnage.chance})`,
      action: () => {
        personnage.chance--;
        alerter(`Chance dépensée. Reste : ${personnage.chance} sur 3. Succès complet automatique.`);
        _presenterResultat(manoeuvre, { niveau: SUCCES_COMPLET, total: 10 }, personnage, onFin);
      }
    });
  }

  afficherActions(actionsDAvant);
}

      action: () => {

function _etape5_Matiere() {
  const estJeune = _p.annee <= 2;
  narrerFrais(
    'Étape 5 sur 12 : Votre matière préférée. ' +
    (estJeune
      ? 'En 1ère ou 2ème Année, vous choisissez parmi les Matières Fondamentales.'
      : 'En 3ème Année ou plus, vous pouvez choisir une matière fondamentale ou optionnelle. ' +
        'Lancez deux dés : le premier indique Fondamentale (1-3) ou Option (4-6), le second la matière.') +
    ' Ou choisissez directement.'
  );

  if (!estJeune) {
    afficherActions([
      {
        label: 'Lancer deux dés',
        action: () => {
          const [d1, d2] = deuxD6Independants();
          const table    = d1 <= 3 ? _tables.matieres_fondamentales : _tables.matieres_options;
          const matiere  = table[String(d2)];
          _p.matieresPreferees = [matiere];
          alerter(`Dé 1 : ${d1} (${d1 <= 3 ? 'Fondamentale' : 'Option'}). Dé 2 : ${d2}. Matière préférée : ${matiere}.`);

function _choixMatieres(fondamentalesUniquement = false) {
  const listes = fondamentalesUniquement
    ? [_tables.matieres_fondamentales]
    : [_tables.matieres_fondamentales, _tables.matieres_options];

  return listes.flatMap(table =>
    Object.values(table).map(m => ({
      label: m,
      action: () => {
        _p.matieresPreferees = [m];
        alerter(`Matière préférée : ${m}.`);

      }

// ================================================================
// Étape 6 — Sorts de départ
// ================================================================
function _etape6_Sorts() {
  const o        = _tables.origines.find(x => x.id === _p.origine);
  const nbSorts  = o?.sorts ?? 1;
  const annee    = Math.min(_p.annee, 7);
  const disponibles = _sorts.annees[String(annee)] ?? _sorts.annees['1'];

  // Les sorts des années précédentes sont connus automatiquement
  const acquis = [];
  for (let a = 1; a < annee; a++) {
    const sortsAnnee = _sorts.annees[String(a)] ?? [];
    acquis.push(...sortsAnnee);
  }
  _p.sorts = [...acquis];

  narrerFrais(
    `Étape 6 sur 12 : Vos sorts de départ. ` +
    (acquis.length > 0
      ? `En tant que sorcier de ${annee}ème Année, vous connaissez automatiquement tous les sorts des années précédentes, soit ${acquis.length} sort${acquis.length > 1 ? 's' : ''}. `
      : '') +
    `En tant que ${o?.label ?? 'sorcier'}, vous choisissez ${nbSorts} sort${nbSorts > 1 ? 's' : ''} supplémentaire${nbSorts > 1 ? 's' : ''} dans votre Année actuelle.`
  );

  _choisirSorts(disponibles, nbSorts, 0);
}

function _choisirSorts(disponibles, total, déjaChoisis) {
  const restants  = total - déjaChoisis;
  const sortsNoms = _p.sorts.map(s => s.nom);
  const dispo     = disponibles.filter(s => !sortsNoms.includes(s.nom));

  if (restants <= 0 || dispo.length === 0) {
    alerter(`Sorts retenus : ${_p.sorts.filter(s => !s._acquis).map(s => s.nom).join(', ')}.`);
    _etape7_Traits();
    return;
  }

  narrer(`Choisissez un sort (${déjaChoisis + 1} sur ${total}) :`);

  afficherActions(dispo.map(s => ({
    label: `${s.nom} — ${s.description} (${_sorts.types[s.type] ?? s.type})`,
    action: () => {
      _p.sorts.push(s);
      alerter(`Sort choisi : ${s.nom}.`);
      _choisirSorts(disponibles, total, déjaChoisis + 1);
    }
  })));
}

function _etape7_Traits() {
  narrerFrais(
    'Étape 7 sur 12 : Vos traits. ' +

    'Le trait le plus élevé définit votre personnage. ' +

  afficherActions([
    {
      label: 'Répartition aléatoire',
      action: () => {
        const valeurs = [-1, 0, 1, 1, 2];
        _melangerTableau(valeurs);
        const noms = ['bravoure', 'ruse', 'intellect', 'loyaute', 'magie'];
        noms.forEach((n, i) => { _p.traits[n] = valeurs[i]; });
        const annonce = Object.entries(NOMS_TRAITS)
          .map(([c, nom]) => `${nom} : ${_signeParle(_p.traits[c])}`)
          .join('. ');
        alerter('Traits assignés aléatoirement. ' + annonce);
        _etape8_Nom();
      }
    },
    {
      label: 'Choisir moi-même',

    }
  ]);

function _assignerTraitManuellement(traitsDispo, valeursDispo) {
  if (traitsDispo.length === 0) {
    const annonce = Object.entries(NOMS_TRAITS)
      .map(([c, nom]) => `${nom} : ${_signeParle(_p.traits[c])}`)
      .join('. ');
    alerter('Traits finaux. ' + annonce);
    _etape8_Nom();
    return;
  }

  const traitActuel = traitsDispo[0];
  const nomTrait    = NOMS_TRAITS[traitActuel];

  narrer(
    `Assignez une valeur à ${nomTrait}. ` +
    `Valeurs restantes : ${valeursDispo.map(_signeParle).join(', ')}.`
  );

  afficherActions(valeursDispo.map(v => ({
    label: `${nomTrait} : ${_signeParle(v)}`,
    action: () => {
      _p.traits[traitActuel] = v;
      alerter(`${nomTrait} : ${_signeParle(v)}.`);
      const nouvellesValeurs = [...valeursDispo];
      nouvellesValeurs.splice(nouvellesValeurs.indexOf(v), 1);
      _assignerTraitManuellement(traitsDispo.slice(1), nouvellesValeurs);
    }
  })));
}

// Champ texte temporaire dans la zone d'actions
function _demanderTexte(question, placeholder, onValide) {
  narrer(question + ' Tapez votre réponse et appuyez sur Entrée.');

  const $liste = document.getElementById('liste-actions');
  $liste.innerHTML = '';

  const li    = document.createElement('li');
  const input = document.createElement('input');
  input.type        = 'text';
  input.placeholder = placeholder;
  input.setAttribute('aria-label', question);

  const btn = document.createElement('button');
  btn.textContent = 'Confirmer';

  const valider = () => {
    const val = input.value.trim();
    if (!val) { alerter('Veuillez entrer une valeur.'); input.focus(); return; }
    onValide(val);
  };

  btn.addEventListener('click', valider);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); valider(); } });

  li.appendChild(input);
  li.appendChild(btn);
  $liste.appendChild(li);
  input.focus();
}

function _tirerAuHasard(tableau) {
  return tableau[Math.floor(Math.random() * tableau.length)];
}

function _melangerTableau(tab) {
  for (let i = tab.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [tab[i], tab[j]] = [tab[j], tab[i]];
  }
}

function _signeParle(val) {
  if (val === 0)  return 'zéro';
  if (val > 0)    return `plus ${val}`;
  return `moins ${Math.abs(val)}`;
}

const { lancerScenario } = (function() {
// Moteur de scénario — charge, affiche et orchestre les scènes JSON.








let _personnage = null;
let _onFin      = null;
let _scenario   = null;
let _etat       = null; // état interne du scénario en cours

// ================================================================
// API publique
// ================================================================

async function lancerScenario(idScenario, personnage, onFin) {
  _personnage = personnage;
  _onFin      = onFin;
  _etat       = { flags: {}, objets: [], sceneActuelle: null };

  try {
    const rep = await fetch(`contenu/scenarios/${idScenario}.json`);
    if (!rep.ok) throw new Error(`Scénario introuvable : ${idScenario}`);
    _scenario = await rep.json();
  } catch (err) {
    alerter(`Impossible de charger le scénario. Erreur : ${err.message}`);
    onFin(personnage);
    return;
  }

  narrerFrais(
    `Scénario : ${_scenario.titre}. ` +
    `${_scenario.description} ` +
    `Durée estimée : ${_scenario.duree_estimee}.`
  );

  afficherActions([
    {
      label: 'Commencer le scénario',
      action: () => _allerScene('debut')
    },
    {
      label: 'Retour au menu de jeu',
      action: () => _onFin(_personnage)
    }
  ]);
}

// ================================================================
// Navigation
// ================================================================

function _allerScene(idScene) {
  const scene = _scenario.scenes[idScene];
  if (!scene) {
    alerter(`Erreur : scène "${idScene}" introuvable.`);
    return;
  }
  _etat.sceneActuelle = idScene;

  // Appliquer les effets automatiques de la scène
  if (scene.effet_entree) _appliquerEffet(scene.effet_entree);

  // Construire et afficher la narration
  const paragraphes = Array.isArray(scene.narration)
    ? scene.narration
    : [scene.narration];
  const texte = paragraphes.map(_remplacerVariables).join(' ');
  narrerFrais(texte);

  // Scène terminale ?
  if (scene.fin) {
    _terminerScenario(scene.fin);
    return;
  }

  // Filtrer les actions disponibles selon les conditions
  const actionsDispos = (scene.actions ?? []).filter(a => _verifierCondition(a.condition));

  if (actionsDispos.length === 0) {
    narrer('Il n\'y a rien de plus à faire ici. Le scénario se termine.');
    _terminerScenario('normal');
    return;
  }

  afficherActions(actionsDispos.map(a => ({
    label: a.label,
    action: () => _executerAction(a)
  })));
}

// ================================================================
// Actions
// ================================================================

function _executerAction(action) {
  // Appliquer un effet immédiat si défini
  if (action.effet) _appliquerEffet(action.effet);

  if (action.manoeuvre) {
    const manoeuvre = MANOEUVRES.find(m => m.id === action.manoeuvre);
    if (!manoeuvre) {
      alerter(`Manœuvre inconnue : ${action.manoeuvre}`);
      return;
    }
    resoudreManoeuvre(manoeuvre, _personnage, ({ niveau }) => {
      mettreAJourFiche(_personnage);
      sauvegarder({ personnage: _personnage });
      const suite = action.suite ?? {};
      let prochaine;
      if      (niveau === SUCCES_COMPLET) prochaine = suite.succes;
      else if (niveau === SUCCES_PARTIEL) prochaine = suite.partiel;
      else                                prochaine = suite.echec;

      if (!prochaine) prochaine = suite.defaut ?? _etat.sceneActuelle;
      if (action.effet_apres) _appliquerEffet(action.effet_apres[niveau] ?? action.effet_apres.defaut);

      _allerScene(prochaine);
    });

  } else if (action.lien) {
    _allerScene(action.lien);

  } else if (action.fin !== undefined) {
    _terminerScenario(action.fin);
  }
}

// ================================================================
// Fin de scénario
// ================================================================

function _terminerScenario(typeFin) {
  const fins = _scenario.fins ?? {};
  const config = fins[typeFin] ?? fins['normal'] ?? {};

  const texte = config.narration
    ? config.narration.map(_remplacerVariables).join(' ')
    : 'Le scénario est terminé.';

  // Append à la scène actuelle (ne pas effacer la narration du dernier événement)
  narrer(texte);

  // Récompenses
  if (config.ami    && !_personnage.amis.includes(config.ami))    _personnage.amis.push(config.ami);
  if (config.rival  && !_personnage.rivaux.includes(config.rival)) _personnage.rivaux.push(config.rival);
  if (config.objet  && !_personnage.objetsMagiques.includes(config.objet)) _personnage.objetsMagiques.push(config.objet);

  mettreAJourFiche(_personnage);
  sauvegarder({ personnage: _personnage });

  afficherActions([
    { label: 'Retour au menu de jeu', action: () => _onFin(_personnage) }
  ]);
}

// ================================================================
// Effets
// ================================================================

function _appliquerEffet(effet) {
  if (!effet) return;
  if (effet.flag)  _etat.flags[effet.flag] = true;
  if (effet.objet) { if (!_etat.objets.includes(effet.objet)) _etat.objets.push(effet.objet); }
  // Effets permanents sur le personnage (ami/rival ajoutés en fin de scénario, pas ici)
}

// ================================================================
// Conditions
// ================================================================

function _verifierCondition(condition) {
  if (!condition) return true;
  if (condition === 'toujours') return true;

  // Support des conditions composées avec && et ||
  if (condition.includes('&&')) {
    return condition.split('&&').map(c => c.trim()).every(_evalCondition);
  }
  if (condition.includes('||')) {
    return condition.split('||').map(c => c.trim()).some(_evalCondition);
  }
  return _evalCondition(condition);
}

function _evalCondition(condition) {
  const c = condition.trim();
  if (c.startsWith('!')) return !_evalCondition(c.slice(1));
  if (c.startsWith('flag:'))  return !!_etat.flags[c.slice(5)];
  if (c.startsWith('objet:')) return _etat.objets.includes(c.slice(6));
  if (c.startsWith('sort:')) {
    const nom = c.slice(5).toLowerCase();
    return _personnage.sorts.some(s => s.nom.toLowerCase().includes(nom));
  }
  if (c.startsWith('trait:')) {
    // ex: trait:intellect>=1
    const m = c.slice(6).match(/^(\w+)(>=|<=|>|<|=)(-?\d+)$/);
    if (!m) return false;
    const [, nomTrait, op, valStr] = m;
    const val  = _personnage.traits[nomTrait] ?? 0;
    const cible = parseInt(valStr, 10);
    switch (op) {
      case '>=': return val >= cible;
      case '<=': return val <= cible;
      case '>':  return val > cible;
      case '<':  return val < cible;
      case '=':  return val === cible;
      default:   return false;
    }
  }
  if (c.startsWith('annee:')) {
    const m = c.slice(6).match(/^(>=|<=|>|<|=)?(\d+)$/);
    if (!m) return false;
    const [, op, valStr] = m;
    const annee = _personnage.annee;
    const cible  = parseInt(valStr, 10);
    switch (op || '=') {
      case '>=': return annee >= cible;
      case '<=': return annee <= cible;
      case '>':  return annee > cible;
      case '<':  return annee < cible;
      case '=':  return annee === cible;
      default:   return false;
    }
  }
  return true;
}

// ================================================================
// Remplacement des variables dans le texte
// ================================================================

function _remplacerVariables(texte) {
  if (!texte) return '';
  return texte
    .replace(/\{\{prenom\}\}/g, _personnage.prenom ?? '')
    .replace(/\{\{nom\}\}/g, _personnage.nom ?? '')
    .replace(/\{\{maison\}\}/g, _personnage.maison ?? '')
    .replace(/\{\{annee\}\}/g, String(_personnage.annee ?? 1))
    .replace(/\{\{patronus\}\}/g, _personnage.patronus ?? 'inconnu');
}

  return { lancerScenario };
})();

        ...toutesLesMatières.map(m => ({
          label: m,
          action: () => {
            _personnage.matieresPreferees.push(m);
            _personnage.progressions.deuxiemeMatiere = true;
            _personnage.experience -= 4;
            alerter(`Deuxième Matière Préférée : ${m}. Expérience remise à zéro.`);
            mettreAJourFiche(_personnage);
            sauvegarder({ personnage: _personnage });
            _afficherMenuJeu();
          }
        })),
        { label: 'Annuler', action: _prendreProgression }
      ]);
    });
}

function _apprendreSortProgression() {
  const annee = Math.min(_personnage.annee, 7);
  fetch('contenu/sorts.json')
    .then(r => r.json())
    .then(sorts => {
      const connusNoms = _personnage.sorts.map(s => s.nom);
      const disponibles = (sorts.annees[String(annee)] ?? [])
        .filter(s => !connusNoms.includes(s.nom));

      if (disponibles.length === 0) {
        alerter('Vous connaissez déjà tous les sorts de votre Année.');
        _prendreProgression();
        return;
      }

      narrer('Choisissez un sort à apprendre :');
      afficherActions([
        ...disponibles.map(s => ({
          label: `${s.nom} — ${s.description}`,
          action: () => {
            _personnage.sorts.push(s);
            _personnage.experience -= 4;
            alerter(`Sort appris : ${s.nom}. Expérience remise à zéro.`);
            mettreAJourFiche(_personnage);
            sauvegarder({ personnage: _personnage });
            _afficherMenuJeu();
          }
        })),
        { label: 'Annuler', action: _prendreProgression }
      ]);
    });
}

// ================================================================
// Fin de session
// ================================================================

function _finSession() {
  narrerFrais(
    'Fin de session. ' +
    'C\'est le moment de mettre à jour vos Amis et Rivaux : vous pouvez en ajouter ou en retirer un. ' +
    'Si vous avez 4 points d\'Expérience, vous pouvez prendre une Progression. ' +
    'Avez-vous complété une année scolaire ? Si oui, vous gagnez automatiquement une Progression.'
  );

  afficherActions([
    {
      label: 'Mettre à jour un Ami',
      action: () => _mettreAJourRelation('ami')
    },
    {
      label: 'Mettre à jour un Rival',
      action: () => _mettreAJourRelation('rival')
    },
    ..._personnage.experience >= 4 ? [{
      label: 'Prendre une Progression (4 XP disponibles)',
      action: _prendreProgression
    }] : [],
    {
      label: 'Sauvegarder et continuer plus tard',
      action: () => {
        sauvegarder({ personnage: _personnage });
        alerter('Partie sauvegardée. À bientôt à Poudlard.');
        _onRetourMenu?.();
      }
    },
    { label: 'Retour au jeu', action: _afficherMenuJeu }
  ]);
}

function _mettreAJourRelation(type) {
  const liste = type === 'ami' ? _personnage.amis : _personnage.rivaux;
  const max   = type === 'ami' ? 2 : 1;

  narrer(
    `${type === 'ami' ? 'Amis' : 'Rival'} actuel${liste.length > 1 ? 's' : ''} : ` +
    (liste.length > 0 ? liste.join(', ') : 'aucun') + `. Maximum : ${max}.`
  );

  const actions = [];

  if (liste.length < max) {
    actions.push({
      label: `Ajouter un ${type}`,
      action: () => {
        const $liste = document.getElementById('liste-actions');
        $liste.innerHTML = '';
        const li = document.createElement('li');
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = `Nom du ${type}`;
        input.setAttribute('aria-label', `Nom du ${type}`);
        const btn = document.createElement('button');
        btn.textContent = 'Confirmer';
        const valider = () => {
          const val = input.value.trim();
          if (!val) { alerter('Entrez un nom.'); input.focus(); return; }
          liste.push(val);
          alerter(`${type === 'ami' ? 'Ami' : 'Rival'} ajouté : ${val}.`);
          sauvegarder({ personnage: _personnage });
          _finSession();
        };
        btn.addEventListener('click', valider);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); valider(); } });
        li.appendChild(input);
        li.appendChild(btn);
        $liste.appendChild(li);
        input.focus();
      }
    });
  }

  if (liste.length > 0) {
    actions.push({
      label: `Retirer un ${type}`,
      action: () => {
        narrer(`Quel ${type} voulez-vous retirer ?`);
        afficherActions([
          ...liste.map((nom, i) => ({
            label: nom,
            action: () => {
              liste.splice(i, 1);
              alerter(`${nom} retiré de vos ${type === 'ami' ? 'amis' : 'rivaux'}.`);
              sauvegarder({ personnage: _personnage });
              _finSession();
            }
          })),
          { label: 'Annuler', action: () => _mettreAJourRelation(type) }
        ]);
      }
    });
  }

  actions.push({ label: 'Retour à la fin de session', action: _finSession });
  afficherActions(actions);
}

// ---- Helper ----

function _signeParle(val) {
  if (val === -99) return 'Inconscient';
  if (val === 0)   return 'zéro';
  if (val > 0)     return `plus ${val}`;
  return `moins ${Math.abs(val)}`;
}

  return { lancerJeu };
})();

// ===== main.js =====
const { etat } = (function() {
// Point d'entrée — initialise le jeu et gère les écrans.










// État global de la session
const etat = {
  personnage: null,
  derniereAction: null  // pour la touche R (relancer les dés)
};

// ---- Démarrage ----

document.addEventListener('DOMContentLoaded', async () => {
  initClavier({
    lireFiche:    (section) => lireFiche(section, etat.personnage),
    sauvegarder:  () => _sauvegarder(),
    relancerDes:  () => etat.derniereAction?.()
  });

  const sauvegarde = charger();
  if (sauvegarde?.personnage) {
    etat.personnage = sauvegarde.personnage;
    mettreAJourFiche(etat.personnage);
    afficherMenuPrincipal(true);
  } else {
    afficherMenuPrincipal(false);
  }
});

// ---- Écrans ----

function afficherMenuPrincipal(aUneSauvegarde) {
  narrerFrais(
    aUneSauvegarde
      ? `Bienvenue à Poudlard, ${etat.personnage.prenom}. Votre aventure vous attend.`
      : 'Bienvenue à Poudlard. Aucune partie en cours. Créez votre sorcière ou sorcier pour commencer.'
  );

  const actions = [];

  if (aUneSauvegarde) {
    actions.push({ label: 'Reprendre la partie',   action: reprendrePartie });
    actions.push({ label: 'Nouvelle partie',        action: demanderConfirmationNouvelle });
  } else {
    actions.push({ label: 'Créer votre sorcière ou sorcier', action: demarrerCreation });
  }

  actions.push({ label: 'Aide et raccourcis clavier', action: afficherAide });

  afficherActions(actions);
}

function reprendrePartie() {
  narrer(`Vous reprenez l'aventure avec ${etat.personnage.prenom} ${etat.personnage.nom}.`);
  _assureProgressions(etat.personnage);
  lancerJeu(etat.personnage, () => afficherMenuPrincipal(true));
}

function demanderConfirmationNouvelle() {
  narrerFrais('Attention : cela effacera votre partie en cours. Êtes-vous certain ?');
  afficherActions([
    { label: 'Oui, commencer une nouvelle partie',  action: demarrerCreation },
    { label: 'Non, retourner au menu',              action: () => afficherMenuPrincipal(true) }
  ]);
}

function demarrerCreation() {
  effacer();
  etat.personnage = creerPersonnageVide();
  lancerCreation(etat.personnage, (personnageFinalise) => {
    etat.personnage = personnageFinalise;
    _assureProgressions(etat.personnage);
    sauvegarder({ personnage: etat.personnage });
    mettreAJourFiche(etat.personnage);
    narrer('Personnage créé et sauvegardé. L\'aventure commence !');
    lancerJeu(etat.personnage, () => afficherMenuPrincipal(true));
  });
}

function afficherAide() {
  narrerFrais([
    'Aide et raccourcis clavier.',
    'Espace : relire le dernier message.',
    'F1 : lire vos traits.',
    'F2 : lire vos états actifs.',
    'F3 : lire vos sorts connus.',
    'F4 : lire vos amis et rivaux.',
    'F5 : lire votre chance et expérience.',
    'R : relancer les dés.',
    'S : sauvegarder la partie.',
    'Tabulation et flèches : naviguer entre les actions.',
    'Entrée : confirmer.',
    'Échappement : retour en arrière.'
  ].join(' '));

  afficherActions([
    { label: 'Retour au menu principal', action: () => afficherMenuPrincipal(!!etat.personnage?.prenom) }
  ]);
}

// ---- Helpers ----

function _sauvegarder() {
  if (!etat.personnage) {
    statuer('Aucun personnage à sauvegarder.');
    return;
  }
  sauvegarder({ personnage: etat.personnage });
}

function _assureProgressions(personnage) {
  if (!personnage.progressions) {
    personnage.progressions = { traitsAmeliores: 0, deuxiemeMatiere: false };
  }
}

// Exporté pour les modules enfants (création, jeu, etc.)

  return { etat };
})();
